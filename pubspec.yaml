name: tracing_app
description: "Arabic and English letter tracing for children (ages 3-5)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sizer: ^3.1.3
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  lottie: ^3.3.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.2
  audioplayers: ^6.7.1
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/letters/
    - assets/images/numbers/
    - assets/images/dragons/
    - assets/images/zoo/
    - assets/images/sea/
    - assets/images/fairy/
    - assets/images/space/
    - assets/images/planet/
    - assets/images/food/
    - assets/images/transportation/
    - assets/images/circis/
    - assets/json/
    - assets/sounds/

  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/NotoKufiArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/NotoKufiArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoKufiArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoKufiArabic-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoKufiArabic-Black.ttf
          weight: 900
